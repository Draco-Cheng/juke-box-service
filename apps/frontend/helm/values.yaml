service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Runtime env vars - set as container environment variables
# Next.js reads NEXT_PUBLIC_* from process.env at runtime in standalone mode
env:
  NEXT_PUBLIC_SUPABASE_URL: ""
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
