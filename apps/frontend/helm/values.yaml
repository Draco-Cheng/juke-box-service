service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

# Runtime env vars - injected into env-config.js at container startup
env:
  VITE_API_URL: "/api"
  VITE_SUPABASE_URL: ""
  VITE_SUPABASE_ANON_KEY: ""
